services:

  kave_kafka:
    image: apache/kafka:latest
    container_name: kave_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - kave_network

  kave_db:
    image: postgres:latest
    container_name: kave_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=kave_pass
      - POSTGRES_DB=kave_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kave_network

  kave_influx_db:
    image: influxdb:latest
    container_name: kave_influx_db
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=kave_pass123 
      - DOCKER_INFLUXDB_INIT_ORG=kave_org
      - DOCKER_INFLUXDB_INIT_BUCKET=kave_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-kave-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - kave_network

  kave_influx_ui:
    image: influxdata/influxdb3-ui:latest
    container_name: kave_influx_ui
    ports:
      - "8081:8080"
    environment:
      - INFLUXDB_URL=http://kave_influx_db:8086
    depends_on:
      - kave_influx_db
    networks:
      - kave_network

  # --- الإضافة الجديدة: خدمة Grafana ---
  kave_grafana:
    image: grafana/grafana:latest
    container_name: kave_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - kave_influx_db
    networks:
      - kave_network

networks:
  kave_network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  grafana_data: # تخزين إعدادات الـ Dashboards عشان ما تضيعش لو قفلت الحاوية