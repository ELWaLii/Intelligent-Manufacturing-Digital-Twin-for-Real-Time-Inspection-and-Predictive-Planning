# ═══════════════════════════════════════════════════════════════════════════════
# KAVE Intelligent Manufacturing — Unified Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
# Enterprise-Grade Production Stack:
#   - Kafka (Message Broker)
#   - PostgreSQL (Relational DB)
#   - InfluxDB (Time-Series DB)
#   - Grafana (CNC Monitoring Dashboards)
#   - Redis (Real-Time Streams)
#   - Vision Engine (PatchCore AI — FastAPI + Redis Consumer)
#   - Vision Producer (Edge Camera Simulator)
#   - Dashboard (Unified Streamlit — Simulation + Vision)
#
# Usage:
#   docker compose up -d
#   Open: http://localhost:8501
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Services
  # ─────────────────────────────────────────────────────────────────────────────

  kave_kafka:
    image: apache/kafka:latest
    container_name: kave_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kave_kafka:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    networks:
      - kave_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kave_db:
    image: postgres:16
    container_name: kave_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kave_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kave_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kave_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kave_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kave_influx_db:
    image: influxdb:latest
    container_name: kave_influx_db
    ports:
      - "8089:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD:-kave_pass123}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-kave_org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-cnc_digital_twin}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-t4Zac1hxXZQvIIfeBCoJLJgxJwWIPDPTknBSl54o1erJHqfG3vPdr0RVZocUGIrfSppVa5nF4gXyKbxEnVJRQA==}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - kave_network
    restart: unless-stopped

  kave_grafana:
    image: grafana/grafana:latest
    container_name: kave_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./infrastructure/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
      - ./infrastructure/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - kave_influx_db
      - kave_db
    networks:
      - kave_network
    restart: unless-stopped

  kave_redis:
    image: redis:7-alpine
    container_name: kave_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --save "" --appendonly no
    networks:
      - kave_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────────────────────────────────────

  kave_vision_engine:
    build:
      context: ./services/vision-engine
      dockerfile: Dockerfile
    container_name: kave_vision_engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=kave_redis
      - DB_HOST=kave_db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-kave_db}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kave_pass}
      - DEFECTS_DIR=/app/defects_archive
    volumes:
      - shared_defects_data:/app/defects_archive
    depends_on:
      kave_redis:
        condition: service_healthy
      kave_db:
        condition: service_healthy
    networks:
      - kave_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  kave_vision_producer:
    build:
      context: ./services/vision-producer
      dockerfile: Dockerfile
    container_name: kave_vision_producer
    environment:
      - REDIS_HOST=kave_redis
    depends_on:
      kave_redis:
        condition: service_healthy
    networks:
      - kave_network
    restart: unless-stopped

  kave_dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: kave_dashboard
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=kave_db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-kave_db}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kave_pass}
      - REDIS_HOST=kave_redis
      - VISION_API_URL=http://kave_vision_engine:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - INFLUX_TOKEN=${INFLUX_TOKEN:-t4Zac1hxXZQvIIfeBCoJLJgxJwWIPDPTknBSl54o1erJHqfG3vPdr0RVZocUGIrfSppVa5nF4gXyKbxEnVJRQA==}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-kave_org}
    volumes:
      - shared_defects_data:/app/defects_archive
    depends_on:
      kave_db:
        condition: service_healthy
      kave_redis:
        condition: service_healthy
    networks:
      - kave_network
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
# Networks & Volumes
# ─────────────────────────────────────────────────────────────────────────────

networks:
  kave_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
  shared_defects_data:
